name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # The package declares os=win32, so npm ci refuses to run on Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; this also keeps npm v12+ behavior.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check tag matches package version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          ref="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "package=$version ref=$ref"
          if [ "$version" != "$ref" ]; then
            echo "::error::Tag $ref does not match package.json version $version"
            exit 1
          fi

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a
      # short-lived credential (trusted publishing). Staged publishing means a
      # maintainer still has to approve the version with 2FA before it goes live.
      - name: Stage publish
        run: npm stage publish --access public --provenance
